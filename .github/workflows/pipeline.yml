name: Monitoring Lab Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validate:
    name: Stage 1 - Compose validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config
        run: docker compose config >/dev/null

  lint-config:
    name: Stage 2 - Config lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
    needs: compose-validate
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: bash -n scripts/smoke.sh
      - name: Check dashboard JSON syntax
        run: python -m json.tool grafana/dashboards/infrastructure-health.json >/dev/null
      - name: Check Prometheus config using promtool
        run: |
          docker run --rm \
            -v "$PWD/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            --entrypoint=promtool prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml
      - name: Check alert rules using promtool
        run: |
          docker run --rm \
            -v "$PWD/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            --entrypoint=promtool prom/prometheus:v2.54.1 \
            check rules /etc/prometheus/alerts.yml

  # Stages 3-5 run in a single job to avoid redundant `docker compose up` in separate runners
  stack-smoke-and-verify:
    name: Stage 3-5 - Stack up, smoke, alert verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRAFANA_ADMIN_USER: ${{ vars.GRAFANA_ADMIN_USER }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      GRAFANA_USER: ${{ vars.GRAFANA_ADMIN_USER }}
      GRAFANA_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
    needs: lint-config
    steps:
      - uses: actions/checkout@v4
      - name: Start monitoring stack
        run: docker compose up -d
      - name: Wait for services to be reachable
        run: |
          SMOKE_RETRIES=30 SMOKE_SLEEP_SECONDS=2 ./scripts/smoke.sh
      - name: Show running services
        run: docker compose ps
      - name: Run smoke health checks
        run: ./scripts/smoke.sh
      - name: Verify alert rules are loaded in Prometheus
        run: |
          curl --fail --silent http://localhost:9090/api/v1/rules | tee rules.json
          grep -q "NodeExporterDown" rules.json
      - name: Teardown
        if: always()
        run: docker compose down --volumes --remove-orphans
